spring.application.name=securekyc-backend

# ==============================
# DATABASE
# ==============================
# Use environment variables so the app does not depend on a hardcoded DB password.
# Example:
#   set DB_USERNAME=root
#   set DB_PASSWORD=your_mysql_password
# On Linux/macOS:
#   export DB_USERNAME=root
#   export DB_PASSWORD=your_mysql_password

spring.datasource.url=jdbc:mysql://localhost:3306/securekyc?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# ==============================
# SERVER
# ==============================

server.port=8081

# ==============================
# SPRING SECURITY LOGGING
# ==============================

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# ==============================
# BREVO SMTP
# ==============================

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.from=${SMTP_FROM:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================
# JWT SESSIONS
# ==============================
# JWT_SECRET is required and must be at least 32 characters long.
security.jwt.secret=${JWT_SECRET:}

# ==============================
# ADMIN SEEDING
# ==============================
# If both are set and no user with this email exists yet, one ADMIN account is created at startup.
# Example:
#   set ADMIN_SEED_EMAIL=admin@securekyc.local
#   set ADMIN_SEED_PASSWORD=your_admin_password
admin.seed.email=${ADMIN_SEED_EMAIL:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}

# ==============================
# DOCUMENT STORAGE
# ==============================
app.uploads.dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==============================
# OCR (Tesseract)
# ==============================
# Path to the tesseract executable. Leave blank to disable OCR auto-fill
# entirely (uploads still work; fields just stay blank for manual entry).
app.ocr.tesseract-path=${TESSERACT_PATH:}
